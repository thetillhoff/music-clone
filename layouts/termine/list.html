{{ define "main" }}
<div id="content_area">

  <div class="j-module n j-header">
    <h1>{{ .Title }}</h1>
  </div>

  <div class="j-module n j-hgrid termine-hgrid" style="margin-top: 45px;">
    <div class="cc-m-hgrid-column termine-col-image" style="width: 28.1%;">
      <div class="j-module n j-imageSubtitle">
        <figure class="cc-imagewrapper cc-m-image-align-1 cc-m-width-maxed">
          <img src="/images/adventskonzert.jpg" alt="Adventskonzert Blaskapelle Bad Wiessee" style="max-width:100%;height:auto;">
        </figure>
        <div class="cc-clear"></div>
      </div>
    </div>
    <div class="cc-m-hgrid-column last" style="width: 69.89%;">
      <div class="j-module n j-table">
        <div style="overflow-x: auto;">
        <table style="border: 1px solid #367714;">
      <thead>
        <tr>
          <th style="border: 1px solid #999999; padding: 7px; width: 205px; text-align: left;">Datum</th>
          <th style="border: 1px solid #999999; padding: 7px; width: 300px; text-align: left;">Veranstaltung</th>
          <th style="border: 1px solid #999999; padding: 7px; width: 450px; text-align: left;">Uhrzeit</th>
        </tr>
      </thead>
      <tbody>
        {{ range hugo.Data.termine }}
        <tr>
          <td style="border: 1px solid #999999; padding: 7px; width: 205px; text-align: left;">
            {{ dateFormat "02.01.2006" .date }}
          </td>
          <td style="border: 1px solid #999999; padding: 7px; width: 300px; text-align: left;">
            {{ .location }}
          </td>
          <td style="border: 1px solid #999999; padding: 7px; width: 450px;">
            {{ .time }} Uhr
          </td>
        </tr>
        {{ end }}
      </tbody>
    </table>
        </div>
      </div>
      <div class="j-module n j-text">
        <p style="text-align: left;">
          <strong>Bei schlechtem Wetter fallen die Konzerte in dieser Saison aus!</strong>
        </p>
      </div>
    </div><!-- end right hgrid column -->
    <br class="cc-clear">
  </div><!-- end hgrid -->

</div>
{{ end }}
