{{ define "main" }}
<div class="j-module n j-header" style="margin-bottom:1.5em;"><h1>{{ .Title }}</h1></div>
<div class="j-module n j-hgrid cc-clearover kontakt-hgrid">
  <div class="cc-m-hgrid-column" style="width:26.36%;">
    <div class="j-module n j-text">
      {{ .Content }}
    </div>
    <div class="j-module n j-imageSubtitle" style="margin-top:1.5em;">
      <figure class="cc-imagewrapper cc-m-width-maxed">
        <img src="/images/kontakt-portrait.jpg" alt="" style="max-width:100%;height:auto;">
      </figure>
    </div>
  </div>
  <div class="cc-m-hgrid-column last" style="width:71.63%;">
    <div class="j-module n j-text">
      <p>Wir freuen uns über Ihr Interesse und beantworten Ihr Anliegen schnellstmöglich.</p>
    </div>
    <div class="j-module n j-imageSubtitle">
      <figure class="cc-imagewrapper cc-m-width-maxed">
        <img src="/images/kontakt-band.jpg" alt="" style="max-width:100%;height:auto;">
      </figure>
    </div>
    <div class="j-module n j-text">
      <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="contact">
        <p hidden><label>Nicht ausfüllen: <input name="bot-field"></label></p>
        <p>
          <label>NAME<br><input type="text" name="name" required style="width:100%;padding:.4em;box-sizing:border-box;"></label>
        </p>
        <p>
          <label>E-MAIL<br><input type="email" name="email" required autocorrect="off" autocapitalize="off" style="width:100%;padding:.4em;box-sizing:border-box;"></label>
        </p>
        <p>
          <label>NACHRICHT<br><textarea name="message" rows="6" required style="width:100%;padding:.4em;box-sizing:border-box;"></textarea></label>
        </p>
        <p>Es gilt unsere <a href="/datenschutz/">Datenschutzerklärung</a></p>
        <p><input type="submit" value="Jetzt abschicken" style="background-color:#666;color:#fff;border:1px solid #333f47;padding:10px 15px;font-size:16px;font-weight:400;border-radius:0;cursor:pointer;"></p>
      </form>
    </div>
  </div>
  <br class="cc-clear">
</div>
{{ end }}
